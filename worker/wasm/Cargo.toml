[package]
name = "runeql-worker-wasm"
version = "0.1.0"
edition = "2024"
description = "RuneQL query engine compiled to raw wasm32-unknown-unknown for Cloudflare Workers edge deployment"

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
