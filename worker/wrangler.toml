name = "runeql"
main = "src/index.js"
compatibility_date = "2025-11-01"
workers_dev = true

routes = [
  { pattern = "runeql.rs3.dev", custom_domain = true }
]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.rql.gz"]
fallthrough = false
